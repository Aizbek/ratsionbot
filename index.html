<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ratsion · правильное питание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="lottie-player.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#3FB069; --green-d:#2E8E52; --green-l:#EAF6EE;
  --amber:#F5A623; --amber-d:#E0921A;
  --bg:#F6F7F4; --card:#FFFFFF; --ink:#1F2A24; --muted:#8A938D;
  --line:rgba(31,42,36,.07); --shadow:0 10px 30px -12px rgba(31,42,36,.18);
  --shadow-lg:0 24px 50px -20px rgba(31,42,36,.28);
  --r:20px; --r-sm:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  overflow-x:hidden;line-height:1.45;-webkit-font-smoothing:antialiased;
}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden}

/* ---------- screen system ---------- */
.screen{position:absolute;inset:0;padding:0 18px 120px;overflow-y:auto;
  opacity:0;transform:translateX(40px) scale(.98);pointer-events:none;
  transition:opacity .45s cubic-bezier(.22,.61,.36,1),transform .45s cubic-bezier(.22,.61,.36,1);
  -webkit-overflow-scrolling:touch}
.screen.active{opacity:1;transform:none;pointer-events:auto}
.screen.back-exit{transform:translateX(40px) scale(.98)}

/* ---------- shared bits ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:16px 2px 14px;background:linear-gradient(180deg,var(--bg) 70%,rgba(246,247,244,0));backdrop-filter:blur(6px)}
.back-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  transition:transform .2s,box-shadow .2s;box-shadow:0 2px 8px -4px rgba(31,42,36,.2)}
.back-btn:active{transform:scale(.92)}
.topbar h2{font-size:19px;font-weight:700;letter-spacing:-.02em}
.ic{width:22px;height:22px;display:inline-block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}

.cta{width:100%;border:none;border-radius:16px;padding:17px;font-family:inherit;font-size:16px;font-weight:700;
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;letter-spacing:-.01em;
  position:relative;overflow:hidden;transition:transform .18s,box-shadow .25s}
.cta:active{transform:scale(.975)}
.cta-amber{background:linear-gradient(135deg,#FBB13C,var(--amber));box-shadow:0 12px 26px -10px rgba(245,166,35,.65)}
.cta-green{background:linear-gradient(135deg,#4CC079,var(--green));box-shadow:0 12px 26px -10px rgba(63,176,105,.55)}
.cta-ghost{background:transparent;color:var(--muted);font-weight:600;font-size:14px;box-shadow:none;padding:13px}
.cta::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-18deg);transition:left .7s}
.cta:not(.cta-ghost):hover::after{left:130%}

.fade-up{opacity:0;transform:translateY(18px);animation:fadeUp .6s forwards}
@keyframes fadeUp{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.13s}.d3{animation-delay:.21s}.d4{animation-delay:.29s}.d5{animation-delay:.37s}.d6{animation-delay:.45s}

/* ---------- WELCOME ---------- */
#welcome{padding-top:0;display:flex;flex-direction:column;min-height:100vh}
.hero{position:relative;margin:0 -18px;padding:64px 26px 50px;
  background:radial-gradient(120% 100% at 50% 0%,#54C683 0%,var(--green) 45%,var(--green-d) 100%);
  border-radius:0 0 34px 34px;overflow:hidden;color:#fff;text-align:center}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{width:240px;height:240px;top:-90px;right:-70px}
.hero::after{width:170px;height:170px;bottom:-70px;left:-50px}
.logo-badge{width:78px;height:78px;border-radius:24px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  backdrop-filter:blur(4px);box-shadow:0 14px 30px -12px rgba(0,0,0,.3)}
.logo-badge .ic{width:40px;height:40px;stroke-width:1.7}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.03em;position:relative}
.hero .sub{font-size:14px;opacity:.9;font-weight:500;margin-top:4px;letter-spacing:.04em;text-transform:uppercase;position:relative}
.welcome-body{flex:1;padding:26px 4px 0}
.welcome-body .lead{font-size:16px;color:var(--ink);font-weight:600;margin-bottom:18px;letter-spacing:-.01em}
.feat{display:flex;gap:13px;align-items:center;padding:14px 16px;margin-bottom:11px;background:var(--card);
  border-radius:var(--r-sm);border:1px solid var(--line);box-shadow:0 4px 14px -10px rgba(31,42,36,.3);
  transition:transform .25s,box-shadow .25s}
.feat:hover{transform:translateY(-3px);box-shadow:0 14px 26px -14px rgba(31,42,36,.35)}
.feat-ic{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.feat-ic .ic{width:23px;height:23px}
.feat p{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.welcome-foot{position:sticky;bottom:0;padding:16px 0 26px;margin-top:14px;
  background:linear-gradient(180deg,rgba(246,247,244,0),var(--bg) 38%)}

/* ---------- MENU ---------- */
.m-hero{margin:0 -18px;padding:20px 20px 18px;text-align:center;background:#fff;
  box-shadow:0 6px 20px -14px rgba(31,42,36,.25)}
.m-hero-logo{width:42%;max-width:165px;height:auto;display:block;margin:0 auto}
.menu-logo-fallback{font-family:Georgia,serif;font-style:italic;font-size:40px;font-weight:500;
  background:linear-gradient(95deg,#E7C66B,#B08D3A);-webkit-background-clip:text;background-clip:text;color:transparent}
.m-body{padding-top:18px}
.m-feature{position:relative;display:flex;align-items:center;gap:16px;padding:20px;border-radius:var(--r);overflow:hidden;cursor:pointer;
  background:linear-gradient(120deg,#4CC079,var(--green-d));color:#fff;box-shadow:0 18px 36px -16px rgba(63,176,105,.6);
  margin-bottom:13px;transition:transform .25s,box-shadow .25s}
.m-feature:hover{transform:translateY(-4px);box-shadow:0 26px 50px -18px rgba(63,176,105,.7)}
.m-feature:active{transform:scale(.98)}
.m-feature::before{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);top:-60px;right:-30px}
.m-feature .f-ic{width:58px;height:58px;border-radius:17px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.m-feature .f-ic .ic{width:30px;height:30px}
.m-feature .f-txt{position:relative;flex:1}
.m-feature h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.m-feature p{font-size:13px;opacity:.9;font-weight:500;margin-top:2px}
.m-feature .f-arrow{position:relative;opacity:.85}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.tile{position:relative;background:var(--card);border-radius:var(--r);border:1px solid var(--line);
  padding:18px 16px;cursor:pointer;overflow:hidden;box-shadow:var(--shadow);min-height:118px;isolation:isolate;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s}
.tile:active{transform:scale(.96)}
.tile:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.tile.photo::before{content:'';position:absolute;inset:0;z-index:-2;
  background-image:var(--img);background-size:cover;background-position:center;
  filter:saturate(1.08);opacity:1}
.tile.photo::after{content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.14) 38%,rgba(255,255,255,.66) 70%,rgba(255,255,255,.92) 100%)}
.tile-ic{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  box-shadow:0 6px 16px -8px rgba(31,42,36,.4)}
.tile-ic .ic{width:25px;height:25px}
.tile h3{font-size:16px;font-weight:700;letter-spacing:-.02em;text-shadow:0 1px 3px rgba(255,255,255,.95),0 2px 10px rgba(255,255,255,.85)}
.tile p{font-size:12px;color:#5a635d;font-weight:700;margin-top:3px;line-height:1.3;text-shadow:0 1px 3px rgba(255,255,255,.95),0 2px 10px rgba(255,255,255,.85)}
.m-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
.m-row:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.m-row:active{transform:scale(.98)}
.m-row .r-ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-row h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.m-row p{font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.m-row .r-arrow{margin-left:auto;color:var(--muted)}

.v-green .tile-ic,.v-green .r-ic,.v-green.feat-ic{background:var(--green-l);color:var(--green-d)}
.v-amber .tile-ic,.v-amber.feat-ic{background:#FDF1DD;color:var(--amber-d)}
.v-blue .tile-ic,.v-blue.feat-ic{background:#E6F0FB;color:#2C6FB5}
.v-pink .tile-ic,.v-pink.feat-ic{background:#FCEAF0;color:#C24C73}
.v-violet .tile-ic,.v-violet .r-ic,.v-violet.feat-ic{background:#EFEBFB;color:#6A52C2}
.v-green .prog-ic{background:var(--green-l);color:var(--green-d)}
.v-amber .prog-ic{background:#FDF1DD;color:var(--amber-d)}
.v-blue .prog-ic{background:#E1EFFC;color:#2C6FB5}
.v-pink .prog-ic{background:#FCEAF0;color:#C24C73}
.v-violet .prog-ic{background:#EFEBFB;color:#6A52C2}
.v-teal .prog-ic{background:#DCF5EF;color:#0E9C84}
.v-orange .prog-ic{background:#FFE9D6;color:#E07A1A}
.prog.v-green{background:#F2FBF5}
.prog.v-amber{background:#FFF9EF}
.prog.v-blue{background:#F1F7FE}
.prog.v-pink{background:#FEF4F8}
.prog.v-violet{background:#F8F5FD}
.prog.v-teal{background:#EEFBF7}
.prog.v-orange{background:#FFF6EE}

#offhours{position:fixed;top:14px;left:14px;right:14px;max-width:452px;margin:0 auto;z-index:900;
  display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-radius:14px;
  background:#FFF7E6;border:1px solid #F2DCA6;box-shadow:0 10px 28px -12px rgba(120,90,20,.35);
  transform:translateY(-130%);opacity:0;transition:transform .5s cubic-bezier(.22,.61,.36,1),opacity .5s}
#offhours.show{transform:none;opacity:1}
#offhours .oh-ic{color:var(--amber-d);flex-shrink:0;margin-top:1px}
#offhours .oh-ic .ic{width:20px;height:20px}
#offhours .oh-body b{font-size:13.5px;font-weight:700;color:#7A5E1A;display:block}
#offhours .oh-body span{font-size:12px;color:#9A7B2E;font-weight:500;line-height:1.4}
#offhours .oh-x{margin-left:auto;color:#C2A55A;font-size:18px;cursor:pointer;flex-shrink:0;line-height:1}

#loader{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(125% 90% at 50% 38%,#FFFDF8 0%,#FAF4E6 55%,#F1E6CC 100%);
  transition:opacity .7s ease,visibility .7s}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.ld-anim{display:flex;align-items:center;justify-content:center}
.ld-brand{margin-top:6px;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:40px;letter-spacing:.01em;
  background:linear-gradient(95deg,#E7C66B,#B08D3A 50%,#D4AF52);-webkit-background-clip:text;background-clip:text;color:transparent;
  opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s ease}
.ld-brand.show{opacity:1;transform:none}
.ld-tag{margin-top:14px;font-size:11px;font-weight:700;letter-spacing:.36em;text-transform:uppercase;color:rgba(176,141,58,.75);
  opacity:0;transform:translateY(8px);transition:opacity .9s ease .15s,transform .9s ease .15s}
.ld-tag.show{opacity:1;transform:none}

/* ---------- CALCULATOR ---------- */
.progress-wrap{padding:6px 2px 18px}
.progress-track{height:7px;background:#E7EAE6;border-radius:99px;overflow:hidden}
.progress-bar{height:100%;width:16%;border-radius:99px;background:linear-gradient(90deg,var(--green),#54C683);
  transition:width .5s cubic-bezier(.22,.61,.36,1)}
.step-label{font-size:12px;color:var(--muted);font-weight:600;margin-top:9px;display:flex;justify-content:space-between}
.q{font-size:23px;font-weight:800;letter-spacing:-.03em;margin:6px 2px 22px;line-height:1.2}
.opt-grid{display:grid;gap:12px}
.opt-grid.two{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:18px 16px;cursor:pointer;
  display:flex;align-items:center;gap:13px;font-size:15px;font-weight:600;letter-spacing:-.01em;
  transition:transform .2s,border-color .2s,box-shadow .25s,background .2s;box-shadow:0 3px 12px -9px rgba(31,42,36,.3)}
.opt:hover{transform:translateY(-3px);box-shadow:0 14px 24px -14px rgba(31,42,36,.32)}
.opt:active{transform:scale(.97)}
.opt.sel{border-color:var(--green);background:var(--green-l)}
.opt.center{flex-direction:column;text-align:center;gap:9px;padding:22px 12px}
.opt .o-ic{width:42px;height:42px;border-radius:13px;background:var(--green-l);color:var(--green-d);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt .o-ic .ic{width:23px;height:23px}
.opt .o-sub{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px}
.num-field{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px 18px;
  display:flex;align-items:center;gap:10px;transition:border-color .25s,box-shadow .25s}
.num-field:focus-within{border-color:var(--green);box-shadow:0 0 0 4px rgba(63,176,105,.13)}
.num-field input{flex:1;border:none;outline:none;font-family:inherit;font-size:34px;font-weight:800;color:var(--ink);
  background:transparent;width:100%;letter-spacing:-.03em}
.num-field input::placeholder{color:#C9CEC9}
.num-field .unit{font-size:15px;color:var(--muted);font-weight:700}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:99px;
  background:linear-gradient(90deg,var(--green) var(--p,40%),#E7EAE6 var(--p,40%));outline:none;margin:8px 0 4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:#fff;border:5px solid var(--green);cursor:pointer;box-shadow:0 4px 12px -2px rgba(63,176,105,.5);transition:transform .15s}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.18)}
.range-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}

.result-hero{position:relative;margin:4px 0 14px;padding:30px 22px;border-radius:26px;text-align:center;color:#fff;overflow:hidden;
  background:radial-gradient(130% 120% at 50% 0%,#54C683,var(--green) 55%,var(--green-d));box-shadow:0 20px 44px -18px rgba(63,176,105,.6)}
.result-hero::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.1);top:-80px;right:-60px}
.result-hero .lbl{font-size:13px;opacity:.92;font-weight:600;letter-spacing:.03em;position:relative}
.result-hero .big{font-size:58px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 2px;position:relative}
.result-hero .big small{font-size:18px;font-weight:700;opacity:.85;margin-left:5px}
.stat-row{display:flex;gap:11px;margin-bottom:20px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;text-align:center;box-shadow:0 4px 14px -10px rgba(31,42,36,.3)}
.stat .sv{font-size:21px;font-weight:800;letter-spacing:-.02em}
.stat .sl{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
.sec-title{font-size:13px;color:var(--muted);font-weight:700;margin:0 2px 11px;text-transform:uppercase;letter-spacing:.04em}

/* ---------- PROGRAMS ---------- */
.prog{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:13px;
  cursor:pointer;overflow:hidden;box-shadow:var(--shadow);transition:transform .28s,box-shadow .28s}
.prog:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.prog:active{transform:scale(.98)}
.prog.rec{border:1.5px solid var(--green)}
.prog .rec-badge{position:absolute;top:14px;right:14px;background:var(--green-l);color:var(--green-d);
  font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px;letter-spacing:.01em}
.prog.rec .prog-top{padding-right:100px}
.prog-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.prog-ic{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prog-ic .ic{width:28px;height:28px}
.prog h3{font-size:18px;font-weight:800;letter-spacing:-.02em}
.prog .kcal{font-size:13px;color:var(--muted);font-weight:600;margin-top:1px}
.prog-meta{display:flex;gap:18px;padding-top:13px;border-top:1px solid var(--line)}
.prog-meta div{font-size:12px;color:var(--muted);font-weight:500}
.prog-meta b{display:block;font-size:14px;color:var(--ink);font-weight:700;margin-top:1px}

/* ---------- ORDER ---------- */
.field-label{font-size:13px;font-weight:700;color:var(--ink);margin:0 2px 9px;letter-spacing:-.01em}
.t-input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:15px 16px;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);outline:none;
  transition:border-color .25s,box-shadow .25s}
.t-input::placeholder{color:#B9BEB9;font-weight:500}
.t-input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(63,176,105,.13)}
.chip-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.chip{flex:1;min-width:calc(50% - 5px);background:var(--card);border:1.5px solid var(--line);border-radius:13px;
  padding:14px 10px;text-align:center;cursor:pointer;font-size:14px;font-weight:700;letter-spacing:-.01em;
  transition:transform .18s,border-color .2s,background .2s}
.chip:active{transform:scale(.96)}
.chip.sel{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.chip small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.chip.sel small{color:var(--green-d)}
.summary{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.total-box{background:var(--green-l);border:1px solid #D8EBC9;border-radius:var(--r);padding:14px 18px;margin-bottom:16px}
.total-line{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--ink);padding:3px 0}
.total-line.disc{color:#C24C73}
.total-line.grand{border-top:1px dashed #BFD9A8;margin-top:6px;padding-top:10px;font-size:17px;font-weight:800;color:var(--green-d)}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);gap:12px}
.sum-row:last-child{border-bottom:none}
.sum-row .k{font-size:13px;color:var(--muted);font-weight:600;flex-shrink:0}
.sum-row .vv{font-size:14px;font-weight:700;text-align:right;letter-spacing:-.01em}
.pay-note{display:flex;gap:11px;align-items:flex-start;background:#FDF1DD;border:1px solid #F5DFB0;border-radius:var(--r-sm);
  padding:14px 15px;margin-bottom:18px}
.pay-note .ic{color:var(--amber-d);flex-shrink:0;margin-top:1px}

.tp-wrap{position:relative;display:flex;justify-content:center;gap:6px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:8px 20px;margin-bottom:14px;overflow:hidden}
.tp-col{height:220px;width:92px;overflow-y:scroll;scroll-snap-type:y mandatory;
  overscroll-behavior:contain;position:relative;z-index:2;
  -ms-overflow-style:none;scrollbar-width:none}
.tp-col::-webkit-scrollbar{display:none}
.tp-item{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;
  font-size:27px;font-weight:800;letter-spacing:-.02em;color:var(--muted);opacity:.32;transform:scale(.78);
  cursor:pointer;transition:opacity .18s,transform .18s,color .18s;font-variant-numeric:tabular-nums}
.tp-item.on{opacity:1;transform:scale(1.1);color:var(--green-d)}
.tp-item.pad{pointer-events:none}
.tp-colon{align-self:center;font-size:26px;font-weight:800;color:var(--green-d);z-index:2;padding-bottom:3px}
.tp-hl{position:absolute;left:16px;right:16px;top:50%;height:46px;transform:translateY(-50%);
  border-radius:13px;background:var(--green-l);border:1.5px solid #CBE7D6;z-index:1;pointer-events:none}
.tp-fade-t,.tp-fade-b{position:absolute;left:0;right:0;height:72px;z-index:3;pointer-events:none}
.tp-fade-t{top:0;background:linear-gradient(180deg,var(--card) 8%,rgba(255,255,255,0))}
.tp-fade-b{bottom:0;background:linear-gradient(0deg,var(--card) 8%,rgba(255,255,255,0))}
.tp-readout{text-align:center;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:16px}
.tp-hint{display:flex;align-items:center;justify-content:center;gap:7px;text-align:center;
  font-size:12.5px;color:var(--muted);font-weight:600;margin:-2px 0 12px;transition:opacity .45s}
.tp-hint.off{opacity:0}
.tp-hint .ic{width:16px;height:16px;flex-shrink:0;animation:hintBob 1.6s ease-in-out infinite}
@keyframes hintBob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}

/* success */
.success-wrap{text-align:center;padding-top:40px}
.check-ring{width:104px;height:104px;border-radius:50%;background:var(--green-l);display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;position:relative;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.check-ring::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--green);opacity:.3;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.check-ring .ic{width:50px;height:50px;color:var(--green-d);stroke-width:2.5}
.check-ring.err{background:#FDECEC}
.check-ring.err::after{border-color:#D9544D}
.check-ring.err .ic{color:#C0392B}
.success-wrap h1{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.success-wrap .order-no{display:inline-block;background:var(--ink);color:#fff;font-size:14px;font-weight:700;
  padding:7px 16px;border-radius:99px;margin:6px 0 16px;letter-spacing:.01em}
.success-wrap p{font-size:14.5px;color:var(--muted);font-weight:500;max-width:300px;margin:0 auto 8px;line-height:1.55}

.content-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);margin-bottom:13px}
.content-card .mission{font-size:15px;color:var(--ink);font-weight:500;line-height:1.6}
.team-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.team-row:last-child{border-bottom:none;padding-bottom:0}
.team-ic{width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.team-row h4{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.team-row p{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px;line-height:1.4}
.promo{position:relative;border-radius:var(--r);padding:20px;margin-bottom:13px;color:#fff;overflow:hidden;box-shadow:var(--shadow)}
.promo::before{content:'';position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.13);top:-50px;right:-40px}
.promo-1{background:linear-gradient(135deg,#FBB13C,var(--amber-d))}
.promo-2{background:linear-gradient(135deg,#54C683,var(--green-d))}
.promo-3{background:linear-gradient(135deg,#5C8FD6,#2C6FB5)}
.promo .ptag{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 11px;border-radius:99px;display:inline-block;margin-bottom:11px;position:relative;letter-spacing:.02em}
.promo h3{font-size:19px;font-weight:800;letter-spacing:-.02em;position:relative;line-height:1.25}
.promo p{font-size:13px;opacity:.92;font-weight:500;margin-top:5px;position:relative}
.contact-row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.contact-row:last-child{border-bottom:none}
.contact-ic{width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.contact-row .ck{font-size:12px;color:var(--muted);font-weight:600}
.contact-row .cv{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-top:1px}

.order-hist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:13px}

.order-hist h4{font-size:16px;font-weight:800;letter-spacing:-.02em}

.reason{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}

function go(screen,replace=false){
  haptic('light');
  if(replace){S.stack[S.stack.length-1]=screen}else{S.stack.push(screen)}
  render();
}
function back(){ haptic('light'); if(S.stack.length>1){S.stack.pop();render()} }

function render(){
  const cur = S.stack[S.stack.length-1];
  app.innerHTML = SCREENS[cur] ? SCREENS[cur]() : SCREENS.menu();
  const el = app.firstElementChild;
  requestAnimationFrame(()=>{ el?.classList.add('active'); });
  attach(cur);
  app.scrollTop=0;
  const sc = app.querySelector('.screen'); if(sc) sc.scrollTop=0;
}

calc:()=>{
  if(S.calc.result!==null) return SCREENS._calcResult();
  return `<div class="screen" id="calc"><div id="calc-inner">${calcStep()}</div></div>`;
},
_calcResult:()=>{
  const c=S.calc, cat=c.recCat, t=c.recTier;
  const categories = getCategories();
  return `<div class="screen" id="calc">
    ${topbar(T('Ваш результат'))}
    <div class="result-hero fade-up d1">
      <div class="lbl">${T('Ваша суточная норма')}</div>
      <div class="big">${c.result.toLocaleString('ru')}<small>${T('ккал')}</small></div>
    </div>
    <div class="stat-row fade-up d2">
      <div class="stat"><div class="sv">${c.bmr.toLocaleString('ru')}</div><div class="sl">BMR</div></div>
      <div class="stat"><div class="sv">${c.tdee.toLocaleString('ru')}</div><div class="sl">TDEE</div></div>
    </div>
    <p class="sec-title fade-up d3">${T('Рекомендуем для вас')}</p>
    <div class="prog v-${cat.v} rec fade-up d3" data-cat="${cat.id}" data-tier="${t.lo}"><span class="rec-badge">${T('Лучший выбор')}</span>
      <div class="prog-top"><div class="prog-ic">${ic(cat.icon)}</div><div><h3>${T(cat.name)}</h3><div class="kcal">${t.label?T(t.label)+' · ':''}${t.lo}–${t.hi} ${T('ккал/день')}</div></div></div>
      <div class="prog-meta"><div>${T('Цена за день')}<b>${sum(t.price)}</b></div><div>${T('Под вашу цель')}<b>${T(goalLabel(c.goal))}</b></div></div>
    </div>
    <p class="sec-title fade-up d4" style="margin-top:16px">${T('Другие программы')}</p>
    ${categories.filter(x=>x.id!==cat.id).map((o,i)=>{const ot=tierForKcal(o,c.result);return `<div class="prog v-${o.v} fade-up d4" data-cat="${o.id}" data-tier="${ot.lo}">
      <div class="prog-top"><div class="prog-ic">${ic(o.icon)}</div><div><h3>${T(o.name)}</h3><div class="kcal">${T(o.sub)} · ${T('от')} ${sum(o.tiers[0].price)}</div></div></div>
    </div>`}).join('')}
    <div style="margin-top:6px" class="fade-up d5">
      <button class="cta cta-ghost" data-act="recalc">${ic('refresh')} ${T('Рассчитать заново')}</button>
    </div>
  </div>`;
},

orders:()=>{
  const list=loadOrders();
  if(!list.length) return `<div class="screen" id="orders">
    ${topbar(T('Мои заказы'))}
    <div class="empty-state fade-up d1">
      <div class="es-ic">${ic('box')}</div>
      <h3>${T('Заказов пока нет')}</h3>
      <p>${T('Самое время выбрать программу питания под ваши цели')}</p>
      <button class="cta cta-green" data-go="programs">${ic('bowl')} ${T('Заказать питание')}</button>
    </div>
  </div>`;
  return `<div class="screen" id="orders">
    ${topbar(T('Мои заказы'))}
    ${list.map((od,i)=>{
      const st=od.status||'В обработке';
      const cls = st==='Доставляется'?'ship' : st==='Доставлен'?'done' : 'proc';
      const canDelete = st!=='Доставляется' && st!=='Доставлен';
      return `<div class="order-hist fade-up d${Math.min(i+1,6)}">
      <div class="oh-top"><h4>${T('Заказ')} ${od.no}</h4>
        <div style="display:flex;align-items:center">
          <span class="status-pill ${cls}"><span class="dot"></span>${T(st)}</span>
          ${canDelete?`<div class="oh-del" data-del="${od.no}" title="${T('Удалить')}">×</div>`:''}
        </div>
      </div>
      <div class="prog-meta" style="border:none;padding:0">
        <div>${T('Программа')}<b>${T(od.category)}</b></div><div>${T('Срок')}<b>${T(od.duration)}</b></div><div>${T('Старт')}<b>${od.date}${od.time?' · '+od.time:''}</b></div>
      </div>
      <div class="total-line grand" style="border-top:1px dashed #BFD9A8;margin-top:10px;padding-top:10px"><span>${T('Итого')}</span><span>${sum(od.total)}</span></div>
      ${st==='Доставляется'?`<div class="ship-banner">${ic('truck')} ${T('Ваш заказ доставляется')}</div>`:''}
    </div>`}).join('')}
    <div style="display:flex;gap:11px;margin-top:4px" class="fade-up d6">
      <button class="cta cta-green" style="flex:1" data-go="programs">${ic('refresh')} ${T('Новый заказ')}</button>
    </div>
  </div>`;
},

programs:()=>{
  const categories = getCategories();
  const recId = S.calc.recCat ? S.calc.recCat.id : null;
  const ordered = recId ? [categories.find(c=>c.id===recId),...categories.filter(c=>c.id!==recId)] : categories;
  return `<div class="screen" id="programs">
    ${topbar(T('Программы питания'))}
    ${recId?`<p class="sec-title fade-up d1" style="margin-top:4px">${T('Рекомендовано по вашему расчёту')}</p>`:''}
    ${ordered.map((cat,i)=>{
      const lo=cat.tiers[0].price, hi=cat.tiers[cat.tiers.length-1].price;
      const priceRange = lo===hi?sum(lo):`${sum(lo)} – ${sum(hi)}`;
      return `<div class="prog v-${cat.v} ${recId&&cat.id===recId?'rec':''} fade-up d${Math.min(i+1,6)}" data-cat="${cat.id}">
      ${recId&&cat.id===recId?`<span class="rec-badge">${T('Для вас')}</span>`:''}
      <div class="prog-top"><div class="prog-ic">${ic(cat.icon)}</div><div><h3>${T(cat.name)}</h3><div class="kcal">${T(cat.sub)}</div></div></div>
      <div class="prog-meta"><div>${T('Калорийность')}<b>${cat.tiers[0].lo}–${cat.tiers[cat.tiers.length-1].hi} ${T('ккал')}</b></div><div>${T('Цена за день')}<b>${priceRange}</b></div></div>
    </div>`}).join('')}
    <p style="font-size:12px;color:var(--muted);text-align:center;margin:12px 6px 0;font-weight:500" class="fade-up d6">${T('Цена указана за 1 день. В стоимость входят доставка, контейнеры и приборы.')}</p>
  </div>`;
},

tiers:()=>{
  const cat=S.order.cat;
  if(!cat) return SCREENS.programs();
  const categories = getCategories();
  const recLo = (S.calc.recCat&&S.calc.recCat.id===cat.id&&S.calc.recTier)?S.calc.recTier.lo:null;
  const gi = Math.max(0, categories.findIndex(c=>c.id===cat.id));
  return `<div class="screen" id="tiers">
    ${topbar(T(cat.name))}
    ${cat.needConfirm?`<div class="pay-note fade-up d1" style="margin-bottom:14px">${ic('info')}<p>${T('Цены этой категории уточняются — менеджер подтвердит при оформлении.')}</p></div>`:''}
    <p class="sec-title fade-up d1">${T('Выберите калорийность')}</p>
    ${cat.tiers.map((t,i)=>`<div class="prog v-${PALETTE[(i+gi*2)%PALETTE.length]} ${recLo===t.lo?'rec':''} fade-up d${Math.min(i+1,6)}" data-cat="${cat.id}" data-tier="${t.lo}">
      ${recLo===t.lo?`<span class="rec-badge">${T('Для вас')}</span>`:''}
      <div class="prog-top"><div class="prog-ic">${ic(cat.icon)}</div><div><h3>${t.label?T(t.label):t.lo+'–'+t.hi+' '+T('ккал')}</h3><div class="kcal">${t.lo}–${t.hi} ${T('ккал/день')}</div></div></div>
      <div class="prog-meta"><div>${T('Цена за день')}<b>${sum(t.price)}</b></div><div>${T('Доставка')}<b>${T('включена')}</b></div></div>
    </div>`).join('')}
  </div>`;
},

order:()=>`<div class="screen" id="order"><div id="order-inner">${orderStep()}</div></div>`,

success:()=>{
  const n = S.order.orderNo || '#—';
  const delivered = S.order.delivered;
  if(delivered){
    const payMsg = S.order.pay==='online'
      ? T('Менеджер свяжется с вами в ближайшее время и отправит реквизиты для онлайн-оплаты.')

function computeCalories(){
  const c=S.calc;
  let bmr = 10*c.weight + 6.25*c.height - 5*c.age + (c.gender==='m'?5:-161);
  let tdee = bmr * ACT[c.activity].k;
  let result = tdee;
  if(c.goal==='loss') result = tdee*0.85;
  if(c.goal==='gain') result = tdee*1.12;
  const floor = c.gender==='f'?1200:1500;
  result = Math.max(result, floor);
  c.bmr=Math.round(bmr); c.tdee=Math.round(tdee); c.result=Math.round(result/10)*10;
  const categories = getCategories();
  const cat = categories.find(x=>x.id==='kaloraj') || categories[0];
  c.recCat = cat;
  c.recTier = tierForKcal(cat, c.result);
}

function orderPricing(o){
  const days=o.days||1;
  const subtotal=o.tier.price*days;
  let discountPct=0;
  if(days>=30) discountPct=15; else if(days>=15) discountPct=10; else if(days>=7) discountPct=5;
  if(o.cat && o.cat.id==='delovoy') discountPct=0;
  const discountAmt=Math.round(subtotal*discountPct/100);
  const total=subtotal-discountAmt;
  return {subtotal,discountPct,discountAmt,total};
}

function dateFrom(days){const d=new Date();d.setDate(d.getDate()+days);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();}

function buildWheel(el,values,selected,onChange){
  const IH=44;
  el.innerHTML='<div class="tp-item pad"></div><div class="tp-item pad"></div>'+
    values.map(v=>`<div class="tp-item">${String(v).padStart(2,'0')}</div>`).join('')+
    '<div class="tp-item pad"></div><div class="tp-item pad"></div>';
  const items=[...el.querySelectorAll('.tp-item')].slice(2,2+values.length);
  let cur=Math.max(0,values.indexOf(selected));
  const mark=i=>items.forEach((it,j)=>it.classList.toggle('on',j===i));
  mark(cur);
  el.scrollTop=cur*IH;
  el.onscroll=()=>{
    const i=Math.max(0,Math.min(values.length-1,Math.round(el.scrollTop/IH)));
    if(i!==cur){ cur=i; mark(i); haptic('light'); onChange(values[i]); }
  };
  items.forEach((it,j)=>it.onclick=()=>el.scrollTo({top:j*IH,behavior:'smooth'}));
  return { set:v=>{ const i=values.indexOf(v); if(i>=0){ cur=i; mark(i); el.scrollTo({top:i*IH,behavior:'smooth'}); } } };
}

function rawOrders(){ try{ return JSON.parse(localStorage.getItem('ratsion_orders')||'[]'); }catch(e){ return []; } }
function writeOrders(list){ try{ localStorage.setItem('ratsion_orders', JSON.stringify(list.slice(0,20))); }catch(e){} }
function parseStoredDate(v){ const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(v||''); if(!m) return null; const d=+m[3],+m[2]-1,+m[1]; return isNaN(d)?null:d; }
function loadOrders(){
  const today=new Date(); today.setHours(0,0,0,0);
  const kept=rawOrders().filter(od=>{
    const start=parseStoredDate(od.date);
    if(start){ const end=new Date(start); end.setDate(end.getDate()+(od.days||1)); if(end<today) return false; }
    return true;
  });
  if(kept.length!==rawOrders().length) writeOrders(kept);
  return kept;
}
function saveOrder(rec){ const list=rawOrders(); list.unshift(rec); writeOrders(list); }
function deleteOrder(no){ writeOrders(rawOrders().filter(o=>o.no!==no)); haptic('light'); render(); }
function nextOrderNo(){ let n=+(localStorage.getItem('ratsion_orderseq')||'1041')+1; try{ localStorage.setItem('ratsion_orderseq',String(n)); }catch(e){} return '#'+n; }
async function syncOrderStatuses(){
  if(!CONFIG.apiBase) return;
  let data=null;
  try{
    const res=await fetch(CONFIG.apiBase.replace(/\/$/,'')+'/my-orders',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ initData:(tg&&tg.initData)||'' })
    });
    if(res.ok) data=await res.json().catch(()=>null);
  }catch(e){ return; }
  if(!data||!data.ok||!Array.isArray(data.orders)) return;
  const byNo={}; data.orders.forEach(o=>{ byNo[o.no]=o.status; });
  let changed=false;
  const list=rawOrders().map(od=>{ const st=byNo[od.no]; if(st&&st!==od.status){ od.status=st; changed=true; } return od; });
  if(changed){ writeOrders(list); if(S.stack[S.stack.length-1]==='orders') render(); }
}

async function submitOrder(btn){
  const o=S.order; const pr=orderPricing(o);
  const tgUser=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)?tg.initDataUnsafe.user:null;
  const payload={
    type:'new_order',
    category:o.cat.name, kcal:o.tier.lo+'-'+o.tier.hi,
    price_per_day:o.tier.price, days:o.days, duration:o.duration,
    subtotal:pr.subtotal, discount_pct:pr.discountPct, discount_amt:pr.discountAmt, total:pr.total,
    date:o.date, delivery_time:o.time, payment:payLabel(o.pay),
    address:o.address, name:o.name, surname:o.surname, phone:o.phone, height:o.height, weight:o.weight,
    tg_id: tgUser?tgUser.id:null, tg_username: tgUser?tgUser.username:null
  };
  let _lbl;
  if(btn){ btn.disabled=true; _lbl=btn.innerHTML; btn.style.opacity='.7'; btn.innerHTML=T('Отправляем…'); }

  let delivered=false, orderNo=null, failReason='server';
  if(CONFIG.apiBase){
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),90000);
    try{
      const res=await fetch(CONFIG.apiBase.replace(/\/$/,'')+'/order',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ initData:(tg&&tg.initData)||'', order:payload }),
        signal:ctrl.signal
      });
      if(res.ok){ const data=await res.json().catch(()=>null);
        if(data&&data.ok&&data.orderNo){ delivered=true; orderNo=data.orderNo; }
        else { failReason='server'; } }
      else { failReason='server'; }
    }catch(e){ failReason = (e&&e.name==='AbortError') ? 'timeout' : 'network'; }
    finally{ clearTimeout(to); }
  } else {
    try{ if(tg&&typeof tg.sendData==='function'){ tg.sendData(JSON.stringify(payload)); } }catch(e){}
  }

  if(!orderNo) orderNo=nextOrderNo();
  o.orderNo=orderNo; o.delivered=delivered; o.failReason = delivered?null:failReason;

  if(delivered){
    saveOrder({ no:orderNo, category:o.cat.name, kcal:o.tier.lo+'–'+o.tier.hi,
      duration:o.duration, days:o.days, date:o.date, time:o.time, pay:o.pay, total:pr.total, ts:Date.now(), status:'Принят' });
    S.hasOrders=true;
  }

  if(btn){ btn.disabled=false; btn.style.opacity=''; btn.innerHTML=_lbl; }
  haptic('heavy');
  go('success');
}

function parseRuDate(v){
  const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(v); if(!m) return null;
  const d=+m[1], mo=+m[2], y=+m[3];
  const dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  if(dt<today) return null;
  const max=new Date(today); max.setDate(max.getDate()+90);
  if(dt>max) return null;
  return dt;
}
function maskRuDate(v){ const d=(v||'').replace(/\D/g,'').slice(0,8);
  let out=d.slice(0,2); if(d.length>2) out+='.'+d.slice(2,4); if(d.length>4) out+='.'+d.slice(4,8); return out; }

const UZ_CODES=['20','33','50','55','61','62','65','66','67','69','70','71','72','73','74','75','76','77','78','79','88','90','91','93','94','95','97','98','99'];
function phoneDigits(v){ let d=(v||'').replace(/\D/g,''); if(d.startsWith('998')) d=d.slice(3); return d; }
function validUzPhone(v){ const d=phoneDigits(v); return d.length===9 && UZ_CODES.includes(d.slice(0,2)); }
function normUzPhone(v){ return '+998'+phoneDigits(v).slice(0,9); }
function fmtUzPhone(v){ const d=phoneDigits(v).slice(0,9);
  let out='+998'; if(d.length) out+=' '+d.slice(0,2); if(d.length>2) out+=' '+d.slice(2,5);
  if(d.length>5) out+=' '+d.slice(5,7); if(d.length>7) out+=' '+d.slice(7,9); return out; }

function attach(cur){
  app.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));
  app.querySelectorAll('[data-act="back"]').forEach(el=>el.onclick=back);
  const homeBtn=app.querySelector('[data-act="home"]'); if(homeBtn) homeBtn.onclick=()=>{S.stack=['menu'];render();};
  const mgr=app.querySelector('[data-act="manager"]'); if(mgr) mgr.onclick=()=>{ go('contactManager'); };

  const mgrPhoneEl=document.getElementById('mgrPhone');
  if(mgrPhoneEl){
    if(!mgrPhoneEl.value.trim()) mgrPhoneEl.value='+998 ';
    mgrPhoneEl.oninput=()=>{ mgrPhoneEl.value=fmtUzPhone(mgrPhoneEl.value); };
    mgrPhoneEl.onfocus=()=>{ if(!mgrPhoneEl.value.trim()) mgrPhoneEl.value='+998 '; };
  }
  const mgrSubmit=app.querySelector('[data-act="contactsubmit"]');
  if(mgrSubmit) mgrSubmit.onclick=async()=>{
    const raw=(document.getElementById('mgrPhone')||{}).value||'';
    if(!validUzPhone(raw.trim())){ popup(T('Введите корректный номер: +998 и 9 цифр\nнапример +998 90 123 45 67')); return; }
    const phone=normUzPhone(raw.trim());
    haptic('light');
    if(CONFIG.apiBase){
      try{
        const res=await fetch(CONFIG.apiBase.replace(/\/$/,'')+'/contact',{
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ initData:(tg&&tg.initData)||'', phone:phone })
        });
        if(res.ok){ const d=await res.json().catch(()=>null);
          if(d&&d.ok){ popup(T('Готово! Менеджер свяжется с вами в ближайшее время.')); back(); return; } }
      }catch(e){}
    }
    if(CONFIG.managerUsername){ const url='https://t.me/'+CONFIG.managerUsername; try{ tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url,'_blank'); }catch(e){ window.open(url,'_blank'); } return; }
    try{ if(tg&&typeof tg.sendData==='function'){ tg.sendData(JSON.stringify({type:'contact_manager', phone:phone})); back(); return; } }catch(e){}
    popup(T('Свяжитесь с нами по телефону ') + CONFIG.phoneText);
  };

  app.querySelectorAll('[data-link]').forEach(el=>el.onclick=()=>{
    const url=el.dataset.link; haptic('light');
    try{
      if(url.startsWith('https://t.me')||url.startsWith('tg:')){ tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url,'_blank'); }
      else if(url.startsWith('tel:')){ window.open(url,'_self'); }
      else { tg?.openLink ? tg.openLink(url) : window.open(url,'_blank'); }
    }catch(e){ window.open(url,'_blank'); }
  });

  const categories = getCategories();
  app.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{
    const cat=categories.find(x=>x.id===el.dataset.cat);
    if(!cat) return;
    if(el.dataset.tier!==undefined && el.dataset.tier!==''){
      const t=cat.tiers.find(x=>String(x.lo)===String(el.dataset.tier)) || cat.tiers[0];
      S.order={cat:cat,tier:t,duration:null,date:null,time:null,timeH:null,timeM:null,detailsDone:false,pay:null,address:'',name:'',surname:'',phone:'',height:'',weight:''};
      go('order');
    } else {
      S.order={cat:cat,tier:null,duration:null,date:null,time:null,timeH:null,timeM:null,detailsDone:false,pay:null,address:'',name:'',surname:'',phone:'',height:'',weight:''};
      go('tiers');
    }
  });

  app.querySelectorAll('[data-gender]').forEach(el=>el.onclick=()=>{ S.calc.gender=el.dataset.gender; haptic('light'); softRender('calc-inner',calcStep); });
  app.querySelectorAll('[data-act-level]').forEach(el=>el.onclick=()=>{ S.calc.activity=el.dataset.actLevel; haptic('light'); softRender('calc-inner',calcStep); });
  app.querySelectorAll('[data-goal]').forEach(el=>el.onclick=()=>{ S.calc.goal=el.dataset.goal; haptic('medium'); computeCalories(); render(); });

  const bodyNext=app.querySelector('[data-act="bodynext"]');
  if(bodyNext) bodyNext.onclick=()=>{
    const age=+document.getElementById('age').value;
    if(age<14||age>80||!age){ popup(T('Введите возраст от 14 до 80')); return; }
    S.calc.age=age; S.calc.bodyDone=true; haptic('light'); softRender('calc-inner',calcStep);
  };
  const hEl=document.getElementById('height'), wEl=document.getElementById('weight');
  if(hEl) hEl.oninput=()=>{ S.calc.height=+hEl.value; document.getElementById('hVal').textContent=hEl.value+' '+T('см'); hEl.style.setProperty('--p',(hEl.value-140)/70*100+'%'); };
  if(wEl) wEl.oninput=()=>{ S.calc.weight=+wEl.value; document.getElementById('wVal').textContent=wEl.value+' '+T('кг'); wEl.style.setProperty('--p',(wEl.value-40)/110*100+'%'); };

  const calcBack=app.querySelector('[data-act="calcback"]');
  if(calcBack) calcBack.onclick=()=>{
    const c=S.calc;
    if(c.goal){c.goal=null;softRender('calc-inner',calcStep);}
    else if(c.activity){c.activity=null;softRender('calc-inner',calcStep);}
    else if(c.bodyDone){c.bodyDone=false;softRender('calc-inner',calcStep);}
    else if(c.gender){c.gender=null;softRender('calc-inner',calcStep);}
    else back();
  };
  const recalc=app.querySelector('[data-act="recalc"]');
  if(recalc) recalc.onclick=()=>{ S.calc={gender:null,age:S.calc.age,height:S.calc.height,weight:S.calc.weight,activity:null,goal:null,result:null,bmr:0,tdee:0,recCat:null,recTier:null}; render(); };

  app.querySelectorAll('[data-dur]').forEach(el=>el.onclick=()=>{ S.order.duration=el.dataset.dur; S.order.days=parseInt(el.dataset.days)||1; haptic('light'); softRender('order-inner',orderStep); });
  app.querySelectorAll('[data-date]').forEach(el=>el.onclick=()=>{ S.order.date = el.dataset.date==='tomorrow'?dateFrom(1):dateFrom(2); haptic('light'); softRender('order-inner',orderStep); });

  const tpH=document.getElementById('tpH'), tpM=document.getElementById('tpM');
  if(tpH&&tpM){
    const o=S.order;
    if(o.timeH==null) o.timeH=8;
    if(o.timeM==null) o.timeM=0;
    const HOURS=[7,8,9], MAX_H=9;
    const MINS=[0,30];
    const mW=buildWheel(tpM,MINS,o.timeM,v=>{
      if(o.timeH===MAX_H&&v!==0){ mW.set(0); return; }
      o.timeM=v;
    });
    const hW=buildWheel(tpH,HOURS,o.timeH,v=>{
      o.timeH=v;
      if(v===MAX_H&&o.timeM!==0){ o.timeM=0; mW.set(0); }
    });

    const hint=document.getElementById('tpHint');
    const hideHint=()=>{ if(hint) hint.classList.add('off'); };
    [tpH,tpM].forEach(el=>{
      el.addEventListener('pointerdown',hideHint,{once:true});
      el.addEventListener('wheel',hideHint,{once:true});
    });

    if(!S.tpNudged){
      S.tpNudged=true;
      const homeTop=HOURS.indexOf(o.timeH)*44;
      const t1=setTimeout(()=>{ tpH.scrollTo({top:homeTop+44,behavior:'smooth'}); },500);
      const t2=setTimeout(()=>{ tpH.scrollTo({top:homeTop,behavior:'smooth'}); },1150);
      const cancelNudge=()=>{ clearTimeout(t1); clearTimeout(t2); };
      [tpH,tpM].forEach(el=>el.addEventListener('pointerdown',cancelNudge,{once:true}));
    }
  }
  const timeNext=app.querySelector('[data-act="timenext"]');
  if(timeNext) timeNext.onclick=()=>{
    const o=S.order;
    if(o.timeH===9) o.timeM=0;
    o.time=String(o.timeH).padStart(2,'0')+':'+String(o.timeM).padStart(2,'0');
    haptic('light'); softRender('order-inner',orderStep);
  };

  app.querySelectorAll('[data-pay]').forEach(el=>el.onclick=()=>{ S.order.pay=el.dataset.pay; haptic('medium'); softRender('order-inner',orderStep); });
  const cDate=document.getElementById('customDate');
  if(cDate) cDate.oninput=()=>{ cDate.value=maskRuDate(cDate.value); };
  const dateNext=app.querySelector('[data-act="datenext"]');
  if(dateNext) dateNext.onclick=()=>{ const v=document.getElementById('customDate').value.trim(); if(!parseRuDate(v)){popup(T('Введите корректную дату в формате ДД.ММ.ГГГГ\n(от сегодня и не позднее, чем через 90 дней)'));return;} S.order.date=v; softRender('order-inner',orderStep); };
  
  const phoneEl=document.getElementById('phone');
  if(phoneEl){
    if(!phoneEl.value.trim()) phoneEl.value='+998 ';
    phoneEl.oninput=()=>{ phoneEl.value=fmtUzPhone(phoneEl.value); };
    phoneEl.onfocus=()=>{ if(!phoneEl.value.trim()) phoneEl.value='+998 '; };
  }
  const detNext=app.querySelector('[data-act="detailsnext"]');
  if(detNext) detNext.onclick=()=>{
    const a=document.getElementById('address').value.trim(), n=document.getElementById('name').value.trim(), s=document.getElementById('surname').value.trim(), p=document.getElementById('phone').value.trim();
    const h=parseInt(document.getElementById('height').value,10), w=parseInt(document.getElementById('weight').value,10);
    if(a.length<6){popup(T('Укажите полный адрес доставки (район, улица, дом)'));return;}
    if(n.length<2){popup(T('Укажите имя'));return;}
    if(s.length<2){popup(T('Укажите фамилию'));return;}
    if(!validUzPhone(p)){popup(T('Введите корректный номер: +998 и 9 цифр\nнапример +998 90 123 45 67'));return;}
    if(!(h>=100&&h<=300)){popup(T('Укажите корректный рост в см (от 100 до 300)'));return;}
    if(!(w>=30&&w<=300)){popup(T('Укажите корректный вес в кг (от 30 до 300)'));return;}
    S.order.address=a;S.order.name=n;S.order.surname=s;S.order.phone=normUzPhone(p);S.order.height=h;S.order.weight=w;S.order.detailsDone=true; haptic('light'); softRender('order-inner',orderStep);
  };
  const orderBack=app.querySelector('[data-act="orderback"]');
  if(orderBack) orderBack.onclick=()=>{
    const o=S.order;
    if(o.pay){o.pay=null;softRender('order-inner',orderStep);}
    else if(o.detailsDone){o.detailsDone=false;softRender('order-inner',orderStep);}
    else if(o.time){o.time=null;softRender('order-inner',orderStep);}
    else if(o.date){o.date=null;softRender('order-inner',orderStep);}
    else if(o.duration){o.duration=null;softRender('order-inner',orderStep);}
    else back();
  };
  const place=app.querySelector('[data-act="placeorder"]');
  if(place) place.onclick=()=>submitOrder(place);

  const retry=app.querySelector('[data-act="retryorder"]');
  if(retry) retry.onclick=()=>submitOrder(retry);

  app.querySelectorAll('[data-del]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); deleteOrder(el.dataset.del); });
  if(cur==='orders') syncOrderStatuses();

  try{
    if(cur==='menu'){ tg?.BackButton?.hide(); }
    else { tg?.BackButton?.show(); }
  }catch(e){}
}

try{ tg?.BackButton?.onClick(()=>back()); }catch(e){}

function updateLangIcon() {
  const txt = document.getElementById('langTxt');
  if (txt) txt.textContent = currentLang === 'ru' ? 'UZ' : 'RUS';
  
  const ohTitle = document.getElementById('ohTitle');
  const ohDesc = document.getElementById('ohDesc');
  if(ohTitle) ohTitle.textContent = T('Сейчас нерабочее время');
  if(ohDesc) ohDesc.textContent = T('Мы работаем 09:00–18:00, кроме воскресенья. Заказы примем, менеджер ответит в рабочие часы.');
  
  const ldTag = document.getElementById('ldTag');
  if(ldTag) ldTag.textContent = T('здоровая и вкусная еда');
}

function toggleLang() {
  currentLang = currentLang === 'ru' ? 'uz' : 'ru';
  localStorage.setItem('ratsion_lang', currentLang);
  updateLangIcon();
  render();
}

updateLangIcon();
render();

(function(){
  const el=document.getElementById('offhours');
  if(!el) return;
  const now=new Date();
  const tash=new Date(now.getTime() + (now.getTimezoneOffset()*60000) + (5*3600000));
  const day=tash.getDay();
  const hr=tash.getHours();
  const closed = (day===0) || (hr<9) || (hr>=18);
  if(closed){
    setTimeout(()=>el.classList.add('show'), 1200);
    setTimeout(()=>el.classList.remove('show'), 8000);
  }
  const x=document.getElementById('ohClose');
  if(x) x.onclick=()=>el.classList.remove('show');
})();

(function(){
  const loader=document.getElementById('loader');
  const brand=document.getElementById('ldBrand');
  const tag=document.getElementById('ldTag');
  const player=document.getElementById('ldLottie');
  if(!loader) return;
  let finished=false;
  function finish(){
    if(finished) return; finished=true;
    brand&&brand.classList.add('show');
    setTimeout(()=>{ tag&&tag.classList.add('show'); }, 300);
    setTimeout(()=>{ loader.classList.add('hide'); setTimeout(()=>loader.remove(),600); }, 900);
  }
  if(player){ player.addEventListener('complete', finish); player.addEventListener('error', finish); }
  setTimeout(finish, 5000);
})();
</script>
